[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "AI News Aggregator that fetches articles from blogs and YouTube RSS feeds, summarizes them, and emails a daily digest."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "google-genai>=0.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "youtube-transcript-api>=0.6.0",
    "python-dotenv>=1.0.0",
    "resend>=0.8.0",
]
